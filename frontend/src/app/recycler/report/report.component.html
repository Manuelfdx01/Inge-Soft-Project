<div class="report-page">

  <!-- ════════════════════════
       HERO / HEADER
  ════════════════════════ -->
  <div class="page-hero">
    <div class="hero-text">
      <span class="eyebrow">Panel de reciclador</span>
      <h1>Reportar incidencia</h1>
      <p>Reporta problemas en un centro de acopio: daños, mal uso o desbordamiento.</p>
    </div>
  </div>

  <!-- ════════════════════════
       FORM CARD
  ════════════════════════ -->
  <div class="report-card">

    <form (ngSubmit)="submit()">

      <!-- Centro de acopio -->
      <div class="field">
        <label>Centro de acopio</label>
        <select
          name="point"
          [(ngModel)]="report.point">
          <option *ngIf="!points.length" value="" disabled>Cargando centros…</option>
          <option
            *ngFor="let point of points"
            [ngValue]="point.id">
            {{ point.name }} — {{ point.address }}
          </option>
        </select>
      </div>

      <!-- Tipo de incidencia -->
      <div class="field">
        <label>Tipo de incidencia</label>
        <select
          name="type"
          [(ngModel)]="report.type">
          <option
            *ngFor="let t of reportTypes"
            [value]="t.value">
            {{ t.label }}
          </option>
        </select>
      </div>

      <!-- Descripción -->
      <div class="field">
        <label>Descripción del problema</label>
        <textarea
          rows="4"
          name="description"
          [(ngModel)]="report.description"
          placeholder="Describe con detalle el problema observado en el centro…">
        </textarea>
      </div>

      <!-- Mensajes -->
      <div class="msg-alert success" *ngIf="success">
        ✅ Reporte enviado correctamente. El centro de acopio ha sido notificado.
      </div>

      <div class="msg-alert error" *ngIf="error">
        ⚠️ {{ error }}
      </div>

      <!-- Botón -->
      <button
        class="btn btn-primary"
        type="submit"
        [disabled]="loading">
        {{ loading ? 'Enviando…' : '📢 Enviar reporte' }}
      </button>

    </form>

  </div>

</div>

<aside class="sidebar">

  <div class="sidebar-header">
    <div class="logo">
      🌱
    </div>

    <div class="brand">
      <h2>GOMI</h2>
      <span>Reciclaje Inteligente</span>
    </div>
  </div>

  <hr>

  <nav class="menu">

    <a
      *ngFor="let item of navItems"
      [routerLink]="item.route"
      routerLinkActive="active"
      class="menu-item">

      <span class="icon">
        {{ item.icon }}
      </span>

      <span class="label">
        {{ item.label }}
      </span>

      <span
        *ngIf="item.badge && item.badge > 0"
        class="badge">
        {{ item.badge }}
      </span>

    </a>

  </nav>

  <div class="sidebar-footer">

    <div class="user-card">

      <div class="avatar">
        {{ initials }}
      </div>

      <div class="user-data">
        <div class="username">
          {{ user?.username }}
        </div>

        <div class="role">
          {{ user?.role | titlecase }}
        </div>

        <div class="points">
          {{ user?.points }} pts
        </div>
      </div>

    </div>

    <button
      class="logout-btn"
      (click)="logout()">

      Cerrar sesión

    </button>

  </div>

</aside>

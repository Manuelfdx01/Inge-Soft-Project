<div class="topbar">

  <!-- Mobile hamburger -->
  <button class="hamburger" (click)="menuToggle.emit()" aria-label="Abrir menú">
    <span></span><span></span><span></span>
  </button>

  <div class="topbar-left">
    <h2>{{ title }}</h2>
  </div>

  <div class="topbar-center">
    <input
      type="text"
      placeholder="Buscar punto de reciclaje..."
      class="search-input">
  </div>

  <div class="topbar-right">

    <!-- Dark mode toggle -->
    <button
      class="icon-btn theme-btn"
      (click)="theme.toggle()"
      [attr.aria-label]="theme.isDark() ? 'Activar modo claro' : 'Activar modo oscuro'"
      [title]="theme.isDark() ? 'Modo claro' : 'Modo oscuro'">
      {{ theme.isDark() ? '☀️' : '🌙' }}
    </button>

    <div class="notif-wrapper">

      <button class="notif-btn" (click)="toggleDropdown()">
        🔔
        <span
          class="notif-badge"
          *ngIf="unreadCount() > 0">
          {{ unreadCount() }}
        </span>
      </button>

      <div
        class="notif-dropdown"
        *ngIf="showDropdown()">

        <div class="notif-header">
          <span>Notificaciones</span>

          <button
            class="mark-all"
            (click)="markAllRead()">
            Marcar todas
          </button>
        </div>

        <div
          class="notif-empty"
          *ngIf="notifications().length === 0">

          No hay notificaciones.

        </div>

        <div
          *ngFor="let notif of notifications()"
          class="notif-item"
          [class.unread]="!notif.is_read"
          (click)="markRead(notif)">

          <div class="notif-message">
            {{ notif.message }}
          </div>

          <div class="notif-time">
            {{ notif.created_at | date:'short' }}
          </div>

        </div>

      </div>

    </div>

    <button class="profile-avatar" (click)="openProfileModal()" title="Ver y editar perfil">
      <img *ngIf="avatarUrl()" [src]="avatarUrl()" [alt]="user()?.username || 'Usuario'" class="avatar-img" />
      <span *ngIf="!avatarUrl()">{{ initials() }}</span>
    </button>

  </div>

</div>

<app-profile-modal
  *ngIf="showProfileModal()"
  (close)="closeProfileModal()">
</app-profile-modal>
